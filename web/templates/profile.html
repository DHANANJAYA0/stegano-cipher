<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile • Stegano-Cipher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes gridShift { 0% { background-position: 0 0, 0 0; } 100% { background-position: 0 20px, 20px 0; } }
    @keyframes scan { 0% { background-position-y: 0; } 100% { background-position-y: 100%; } }
  </style>
  <style id="themeOverrides">
/* Light Mode */
body[data-theme="light"] {
  background: #f3f4f6;
  color: #111827;
}
body[data-theme="light"] .text-white { color: #111827 !important; }
body[data-theme="light"] .text-cyan-200 { color: #4b5563 !important; }
body[data-theme="light"] .text-cyan-50 { color: #111827 !important; }
body[data-theme="light"] .bg-black\/50, body[data-theme="light"] .bg-black\/80 { background-color: #ffffff !important; }
body[data-theme="light"] .bg-black\/40 { background-color: #f9fafb !important; }
body[data-theme="light"] .bg-black\/60 { background-color: #ffffff !important; }
body[data-theme="light"] .border-cyan-400\/60, body[data-theme="light"] .border-cyan-400\/40, body[data-theme="light"] .border-cyan-500\/50, body[data-theme="light"] .border-cyan-500\/30 { border-color: #d1d5db !important; }
body[data-theme="light"] .border-cyan-400 { border-color: #9ca3af !important; }
body[data-theme="light"] .ring-cyan-400\/50 { --tw-ring-color: #d1d5db !important; }
body[data-theme="light"] .shadow-\[0_0_24px_\#00f0ff\], body[data-theme="light"] .shadow-\[0_0_24px_rgba\(0\,240\,255\,0\.3\)\] { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important; }
body[data-theme="light"] .shadow-\[0_0_12px_\#00f0ff\] { box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06) !important; }
body[data-theme="light"] .shadow-\[0_0_10px_rgba\(0\,240\,255\,0\.5\)\], body[data-theme="light"] .shadow-\[0_0_20px_rgba\(0\,240\,255\,0\.5\)\] { box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important; }
body[data-theme="light"] .hover\:shadow-\[0_0_30px_rgba\(0\,240\,255\,0\.8\)\]:hover { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.15) !important; }
body[data-theme="light"] .bg-cyan-600 { background-color: #3b82f6 !important; color: white !important; }
body[data-theme="light"] .bg-cyan-600\/30 { background-color: #eff6ff !important; }
body[data-theme="light"] .bg-cyan-500 { background-color: #3b82f6 !important; color: white !important; }
body[data-theme="light"] .bg-cyan-900\/50 { background-color: #f3f4f6 !important; color: #111827 !important; border-color: #d1d5db !important;}
body[data-theme="light"] .bg-cyan-500\/80 { background-color: #bfdbfe !important; color: #111827 !important; }
body[data-theme="light"] .hover\:bg-cyan-300:hover, body[data-theme="light"] .hover\:bg-cyan-500:hover { background-color: #dbeafe !important; color: #1d4ed8 !important; }
body[data-theme="light"] .hover\:text-white:hover { color: #1d4ed8 !important; }
body[data-theme="light"] .accent-cyan-400 { accent-color: #3b82f6 !important; }
body[data-theme="light"] #mainBgGrad, body[data-theme="light"] .cyber-element { display: none !important; }
body[data-theme="light"] .bg-clip-text { background-image: linear-gradient(90deg, #1d4ed8, #7e22ce) !important; -webkit-background-clip: text; background-clip: text; color: transparent !important; }
body[data-theme="light"] input, body[data-theme="light"] textarea, body[data-theme="light"] select { background-color: #ffffff !important; color: #111827 !important; border-color: #d1d5db !important; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05) !important; }
body[data-theme="light"] input::placeholder, body[data-theme="light"] textarea::placeholder { color: #9ca3af !important; }
body[data-theme="light"] select option { color: #111827 !important; background: #ffffff !important;}

/* Dark Mode */
body[data-theme="dark"] {
  background: #111827;
  color: #f3f4f6;
}
body[data-theme="dark"] .text-white { color: #f3f4f6 !important; }
body[data-theme="dark"] .text-cyan-200 { color: #9ca3af !important; }
body[data-theme="dark"] .text-cyan-50 { color: #f3f4f6 !important; }
body[data-theme="dark"] .bg-black\/50, body[data-theme="dark"] .bg-black\/80 { background-color: #1f2937 !important; }
body[data-theme="dark"] .bg-black\/40, body[data-theme="dark"] .bg-black\/60 { background-color: #374151 !important; }
body[data-theme="dark"] .border-cyan-400\/60, body[data-theme="dark"] .border-cyan-400\/40, body[data-theme="dark"] .border-cyan-500\/50, body[data-theme="dark"] .border-cyan-500\/30 { border-color: #4b5563 !important; }
body[data-theme="dark"] .border-cyan-400 { border-color: #6b7280 !important; }
body[data-theme="dark"] .ring-cyan-400\/50 { --tw-ring-color: #4b5563 !important; }
body[data-theme="dark"] .shadow-\[0_0_24px_\#00f0ff\], body[data-theme="dark"] .shadow-\[0_0_24px_rgba\(0\,240\,255\,0\.3\)\] { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important; }
body[data-theme="dark"] .shadow-\[0_0_12px_\#00f0ff\] { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4) !important; }
body[data-theme="dark"] .shadow-\[0_0_10px_rgba\(0\,240\,255\,0\.5\)\], body[data-theme="dark"] .shadow-\[0_0_20px_rgba\(0\,240\,255\,0\.5\)\] { box-shadow: 0 2px 5px rgba(0,0,0,0.3) !important; }
body[data-theme="dark"] .hover\:shadow-\[0_0_30px_rgba\(0\,240\,255\,0\.8\)\]:hover { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5) !important; }
body[data-theme="dark"] .bg-cyan-600 { background-color: #4b5563 !important; color: #f3f4f6 !important;}
body[data-theme="dark"] .bg-cyan-600\/30 { background-color: #374151 !important; }
body[data-theme="dark"] .bg-cyan-500 { background-color: #4b5563 !important; color: #f3f4f6 !important;}
body[data-theme="dark"] .bg-cyan-900\/50 { background-color: #1f2937 !important; color: #f3f4f6 !important; border-color: #4b5563 !important;}
body[data-theme="dark"] .bg-cyan-500\/80 { background-color: #374151 !important; color: #f3f4f6 !important; }
body[data-theme="dark"] .hover\:bg-cyan-300:hover, body[data-theme="dark"] .hover\:bg-cyan-500:hover { background-color: #111827 !important; border-color: #9ca3af !important; color: white !important; }
body[data-theme="dark"] .hover\:text-white:hover { color: #f3f4f6 !important; }
body[data-theme="dark"] .accent-cyan-400 { accent-color: #9ca3af !important; }
body[data-theme="dark"] #mainBgGrad, body[data-theme="dark"] .cyber-element { display: none !important; }
body[data-theme="dark"] .bg-clip-text { background-image: linear-gradient(90deg, #9ca3af, #d1d5db) !important; -webkit-background-clip: text; background-clip: text; color: transparent !important; }
body[data-theme="dark"] input, body[data-theme="dark"] textarea, body[data-theme="dark"] select { background-color: #111827 !important; color: #f3f4f6 !important; border-color: #4b5563 !important; }
body[data-theme="dark"] input::placeholder, body[data-theme="dark"] textarea::placeholder { color: #6b7280 !important; }
body[data-theme="dark"] select option { color: #f3f4f6 !important; background: #111827 !important;}
  </style>
</head>
<body class="text-white relative" data-theme="cyber">
  <div class="absolute inset-0 -z-10" id="mainBgGrad">
    <div class="h-full w-full" style="background: radial-gradient(ellipse at center, #0a0f1f 0%, #050914 40%, #02040a 100%);"></div>
    <div class="absolute inset-0 opacity-30" style="background-image: repeating-linear-gradient(0deg, rgba(0,240,255,0.08) 0 2px, transparent 2px 20px), repeating-linear-gradient(90deg, rgba(255,0,255,0.06) 0 2px, transparent 2px 20px); background-size: 100% 100%; animation: gridShift 12s linear infinite;"></div>
    <div class="absolute inset-0" style="background-image: linear-gradient(transparent, rgba(255,255,255,0.03) 50%, transparent); background-size: 100% 4px; animation: scan 6s linear infinite;"></div>
  </div>
  <div class="max-w-3xl mx-auto py-8 px-4 pb-16">
    <div class="flex items-center justify-between">
      <h1 class="leading-tight">
        <span class="block text-2xl md:text-3xl font-extrabold bg-clip-text text-transparent" style="background-image: linear-gradient(90deg,#00f0ff,#ff00ff)">Profile</span>
        <span class="block text-cyan-200 md:text-lg">{{ user.name }}</span>
      </h1>
      <div class="flex items-center gap-3 text-sm">
        <select id="themeSelector" class="bg-black/40 border border-cyan-400/60 text-cyan-200 rounded px-2 py-1 outline-none text-xs" style="transition:all 0.3s">
          <option value="cyber">Cyber</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
        <a href="/profile" class="h-8 w-8 rounded-full bg-cyan-600 text-white flex items-center justify-center font-semibold">
          {{ (user.name if user else '')[:1]|upper }}
        </a>
        <div class="flex items-center gap-2 rounded-xl border border-cyan-400/60 bg-black/40 backdrop-blur px-2 py-1 shadow-[0_0_12px_#00f0ff]">
          <a href="/" class="inline-flex items-center gap-1 rounded-md border border-cyan-400 px-3 py-1 text-cyan-200 hover:bg-cyan-300 hover:text-black">Home</a>
          <a href="/history" class="inline-flex items-center gap-1 rounded-md border border-cyan-400 px-3 py-1 text-cyan-200 hover:bg-cyan-300 hover:text-black">History</a>
          {% if user and (user.role == 'admin') %}
          <a href="/admin/history" class="inline-flex items-center gap-1 rounded-md border border-cyan-400 px-3 py-1 text-cyan-200 hover:bg-cyan-300 hover:text-black">Admin</a>
          {% endif %}
        </div>
      </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-black/60 backdrop-blur border-t border-cyan-400/60">
      <div class="max-w-3xl mx-auto px-4 py-2 flex justify-end">
        <a href="/logout" class="inline-flex items-center gap-1 rounded-md border border-cyan-400 px-4 py-2 text-cyan-200 hover:bg-cyan-300 hover:text-black">Logout</a>
      </div>
    </div>

    {% if error %}
      <div class="mt-4 bg-rose-500/20 text-rose-300 rounded p-2">{{ error }}</div>
    {% endif %}
    {% if msg %}
      <div class="mt-4 bg-emerald-500/20 text-emerald-300 rounded p-2">{{ msg }}</div>
    {% endif %}

    <div class="mt-6 grid md:grid-cols-2 gap-6">
      <div class="bg-black/50 backdrop-blur rounded shadow-[0_0_24px_#00f0ff] ring-1 ring-cyan-400/50 p-4">
        <h2 class="text-lg font-semibold">Basic Details</h2>
        <form method="post" class="mt-3 space-y-3">
          <div>
            <label class="block text-sm text-cyan-200">Email</label>
            <input type="email" value="{{ user.email }}" class="mt-1 w-full rounded border border-cyan-400/60 bg-black/40 text-white p-2" disabled />
          </div>
          <div>
            <label class="block text-sm text-cyan-200">Name</label>
            <input name="name" type="text" value="{{ user.name }}" class="mt-1 w-full rounded border border-cyan-400/60 bg-black/40 text-white p-2 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
          </div>
          <button class="rounded px-3 py-2 border border-cyan-400 text-cyan-200 hover:text-black hover:bg-cyan-300 transition shadow-[0_0_12px_#00f0ff]">Update Name</button>
        </form>
      </div>

      <div class="bg-black/50 backdrop-blur rounded shadow-[0_0_24px_#00f0ff] ring-1 ring-cyan-400/50 p-4">
        <h2 class="text-lg font-semibold">Change Password</h2>
        <form method="post" class="mt-3 space-y-3">
          <div>
            <label class="block text-sm text-cyan-200">Current Password</label>
            <input name="current_password" type="password" class="mt-1 w-full rounded border border-cyan-400/60 bg-black/40 text-white p-2 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
          </div>
          <div>
            <label class="block text-sm text-cyan-200">New Password</label>
            <input name="new_password" type="password" class="mt-1 w-full rounded border border-cyan-400/60 bg-black/40 text-white p-2 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
          </div>
          <button class="rounded px-3 py-2 border border-cyan-400 text-cyan-200 hover:text-black hover:bg-cyan-300 transition shadow-[0_0_12px_#00f0ff]">Update Password</button>
        </form>
      </div>
    </div>

    <div class="mt-6 grid md:grid-cols-2 gap-6">
      <div class="bg-black/50 backdrop-blur rounded shadow-[0_0_24px_#00f0ff] ring-1 ring-cyan-400/50 p-4">
        <h2 class="text-lg font-semibold">Admin Access</h2>
        <form method="post" class="mt-3 space-y-3">
          <div>
            <label class="block text-sm text-cyan-200">Admin Invite Code</label>
            <input name="admin_code" type="text" class="mt-1 w-full rounded border border-cyan-400/60 bg-black/40 text-white p-2 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
          </div>
          <button class="rounded px-3 py-2 border border-cyan-400 text-cyan-200 hover:text-black hover:bg-cyan-300 transition shadow-[0_0_12px_#00f0ff]">Upgrade to Admin</button>
        </form>
      </div>
    </div>
  </div>
  </div>
  <script>
    const themeSelector = document.getElementById('themeSelector');
    if (themeSelector) {
      const storedTheme = localStorage.getItem('theme') || 'cyber';
      document.body.setAttribute('data-theme', storedTheme);
      themeSelector.value = storedTheme;

      themeSelector.addEventListener('change', (e) => {
        document.body.setAttribute('data-theme', e.target.value);
        localStorage.setItem('theme', e.target.value);
      });
    }
  </script>
  {% include '_stegbot.html' %}
</body>
</html>
